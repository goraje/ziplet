[project]
name = "ziplet"
dynamic = ["version"]
authors = [
    { name = "Jerzy Góra", email = "goraje@users.noreply.github.com" },
]
description = "ZIP library derived from CPython zipfile with WinZip AES and ZipCrypto support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=46.0.6",
    "typing-extensions>=4.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
zstd = ["backports.zstd>=1.0.0; python_version < '3.14'"]

[build-system]
requires = ["hatch-vcs>=0.5.0", "hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-sugar>=1.1.1",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["*.md"]
lint.select = [
    "B",
    "E",
    "F",
    "I",
    "PIE",
    "PT",
    "W",
]

[tool.pytest.ini_options]
markers = [
    "windows: tests that require a Windows runner and 7-Zip",
]

[tool.typos.default.extend-words]
Stichting = "Stichting"
STICHTING = "STICHTING"
Mathematisch = "Mathematisch"
MATHEMATISCH = "MATHEMATISCH"

[tool.typos.default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(#|//)\\s*spellchecker:ignore-next-line\\n.*",
]
